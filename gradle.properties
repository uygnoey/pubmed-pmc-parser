# Gradle 설정
# org.gradle.java.home - DO NOT set here! Use JAVA_HOME environment variable instead
# This allows CI environments to use their own JDK paths
org.gradle.caching=true
org.gradle.parallel=true

# Maven Central Publishing (Vanniktech Plugin)
# https://vanniktech.github.io/gradle-maven-publish-plugin/central/

# Enable Maven Central Publishing
mavenCentralPublishing=true

# POM Metadata
POM_NAME=PubMed & PMC XML Parser
POM_DESCRIPTION=High-performance streaming parser for PubMed Baseline/Update files and PMC Open Access articles with JATS 1.4 support
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/brillianttiger/pubmed-pmc-parser

# License
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

# Developers
POM_DEVELOPER_ID=brillianttiger
POM_DEVELOPER_NAME=Brilliant Tiger
POM_DEVELOPER_EMAIL=dev@brillianttiger.com
POM_DEVELOPER_URL=https://github.com/brillianttiger

# SCM
POM_SCM_URL=https://github.com/brillianttiger/pubmed-pmc-parser
POM_SCM_CONNECTION=scm:git:git://github.com/brillianttiger/pubmed-pmc-parser.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/brillianttiger/pubmed-pmc-parser.git

