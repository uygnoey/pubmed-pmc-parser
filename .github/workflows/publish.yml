name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v1.0.1, v2.0.0 등의 태그가 push될 때 실행

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Update version in build.gradle.kts
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        sed -i "s/version = \".*\"/version = \"$VERSION\"/" build.gradle.kts
        echo "Updated version to: $VERSION"
        grep "version = " build.gradle.kts

    - name: Build and test (skip integration tests)
      run: ./gradlew clean build -x javadoc --no-daemon --stacktrace
      env:
        JAVA_OPTS: -Xmx3g

    - name: Publish to Maven Central
      run: ./gradlew publish --no-daemon --stacktrace
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          **/build/libs/*.jar
        retention-days: 30

    - name: Publish summary
      run: |
        echo "## 🚀 Maven Central Publication" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Successfully published version **${{ steps.version.outputs.VERSION }}** to Maven Central staging repository." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Published Modules" >> $GITHUB_STEP_SUMMARY
        echo "- io.brillianttiger.bio:common:${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- io.brillianttiger.bio:pubmed:${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- io.brillianttiger.bio:pmc:${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔄 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Log in to https://s01.oss.sonatype.org/" >> $GITHUB_STEP_SUMMARY
        echo "2. Navigate to 'Staging Repositories'" >> $GITHUB_STEP_SUMMARY
        echo "3. Select your staging repository (iobrillanttiger-XXXX)" >> $GITHUB_STEP_SUMMARY
        echo "4. Click 'Close' and wait for validation (~5-10 minutes)" >> $GITHUB_STEP_SUMMARY
        echo "5. Click 'Release' to publish to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⏱️ Maven Central sync: 10 minutes ~ 2 hours" >> $GITHUB_STEP_SUMMARY
        echo "🔍 Search availability: 2 hours ~ 24 hours" >> $GITHUB_STEP_SUMMARY
