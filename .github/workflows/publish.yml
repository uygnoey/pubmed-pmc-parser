name: Publish to Maven Central

on:
  release:
    types: [published]  # GitHub Release가 published될 때 자동 실행

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract version from release tag
      id: version
      run: |
        TAG_NAME="${{ github.event.release.tag_name }}"
        VERSION="${TAG_NAME#v}"  # Remove 'v' prefix
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION (from tag: $TAG_NAME)"

    - name: Update version in build.gradle.kts
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        sed -i "s/version = \".*\"/version = \"$VERSION\"/" build.gradle.kts
        echo "Updated version to: $VERSION"
        grep "version = " build.gradle.kts

    - name: Build and test (skip integration tests)
      run: ./gradlew clean build -x javadoc --no-daemon --stacktrace
      env:
        JAVA_OPTS: -Xmx3g

    - name: Publish and release to Maven Central
      run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon --stacktrace
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_BIO_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_BIO_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          **/build/libs/*.jar
        retention-days: 30

    - name: Publish summary
      run: |
        echo "## 🚀 Maven Central Publication" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Successfully published version **${{ steps.version.outputs.VERSION }}** to Maven Central." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Published Modules" >> $GITHUB_STEP_SUMMARY
        echo "- io.brillianttiger.bio:common:${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- io.brillianttiger.bio:pubmed:${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- io.brillianttiger.bio:pmc:${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔍 Verification" >> $GITHUB_STEP_SUMMARY
        echo "Check your publication status at:" >> $GITHUB_STEP_SUMMARY
        echo "- https://central.sonatype.com/publishing" >> $GITHUB_STEP_SUMMARY
        echo "- https://central.sonatype.com/artifact/io.brillianttiger.bio/pubmed/${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⏱️ Maven Central sync: 10 minutes ~ 2 hours" >> $GITHUB_STEP_SUMMARY
        echo "🔍 Search availability: 2 hours ~ 24 hours" >> $GITHUB_STEP_SUMMARY
